<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Benjamin Fesquet — Saddle Fitter | MACEL</title>
<meta name="description" content="Benjamin Fesquet — Saddle Fitter, MACEL SELLIER">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#0d204a;
  --gold:#c49a52;
  --cream:#f6f0e4;
  --cream-dark:#e9dfcf;
  --white:#faf8f3;
}
*{box-sizing:border-box}
html{background:var(--navy)}
body{
  margin:0; min-height:100vh; padding:22px;
  display:flex; justify-content:center; align-items:center;
  background-color:var(--cream);
  background-image:url('paper-grain.png');
  background-repeat:repeat;
  background-size:256px 256px;
  color:var(--navy);
  font-family:Montserrat,Arial,sans-serif;
}
.page{
  width:100%; max-width:460px;
  text-align:center;
}
.logo-wrap{
  padding:4px 12px 34px;
}
.logo{
  display:block; width:300px; max-width:90%; height:auto;
  margin:0 auto;
}
.panel{
  position:relative;
  background:
    linear-gradient(rgba(255,255,255,.025),rgba(255,255,255,.025)),
    var(--navy);
  border:1px solid var(--gold);
  box-shadow:0 18px 45px rgba(13,32,74,.18);
  padding:58px 34px 40px;
}
.panel:after{
  content:"";
  position:absolute; inset:7px;
  border:1px solid rgba(196,154,82,.18);
  pointer-events:none;
}
.name{
  position:relative;
  z-index:1;
  margin:0;
  color:var(--white);
  font:500 47px/1 "Cormorant Garamond",Georgia,serif;
  letter-spacing:.1px;
}
.role{
  position:relative;
  z-index:1;
  margin-top:14px;
  color:#eee7da;
  font:500 13px/1 Montserrat,Arial,sans-serif;
  letter-spacing:4px;
}
.divider{
  width:62px; height:1px; margin:25px auto 28px;
  background:var(--gold);
  position:relative; z-index:1;
}
.actions{
  position:relative; z-index:1;
  display:grid; gap:0;
  text-align:left;
}
.action{
  min-height:76px;
  display:grid;
  grid-template-columns:44px 1fr 20px;
  align-items:center;
  gap:12px;
  color:var(--white);
  text-decoration:none;
  border-bottom:1px solid rgba(238,231,218,.28);
}
.action:first-child{border-top:1px solid rgba(238,231,218,.28)}
.icon{
  width:27px; height:27px; display:flex; align-items:center; justify-content:center;
  color:#eee0c6;
}
.label{
  font:400 23px/1.1 "Cormorant Garamond",Georgia,serif;
}
.arrow{
  color:#ead9b9; font-size:26px; text-align:right;
}
.website{
  position:relative; z-index:1;
  display:inline-block; margin-top:25px;
  color:#eee7da; text-decoration:none;
  font:500 10px/1 Montserrat,Arial,sans-serif;
  letter-spacing:2px; text-transform:uppercase;
  padding-bottom:5px; border-bottom:1px solid var(--gold);
}
.slogan{
  margin:30px 15px 0;
  color:var(--navy);
  font:400 18px/1.35 "Cormorant Garamond",Georgia,serif;
  letter-spacing:.35px;
}
.slogan:before{
  content:"";
  display:block; width:55px; height:1px;
  background:var(--gold); margin:0 auto 17px;
}
@media(max-width:390px){
  body{padding:14px}
  .logo-wrap{padding-bottom:25px}
  .panel{padding:45px 23px 30px}
  .name{font-size:41px}
  .label{font-size:21px}
  .action{min-height:69px}
}
</style>
</head>
<body>
<main class="page">
  <div class="logo-wrap">
    <img class="logo" src="macel-logo.png" alt="MACEL — Sellier France depuis 1968">
  </div>

  <section class="panel">
    <h1 class="name">Benjamin Fesquet</h1>
    <div class="role">SADDLE FITTER</div>
    <div class="divider"></div>

    <nav class="actions" aria-label="Coordonnées">
      <a class="action" href="benjamin-fesquet.vcf" download>
        <span class="icon" aria-hidden="true">
          <svg viewBox="0 0 32 32" width="27" height="27" fill="none" stroke="currentColor" stroke-width="1.5">
            <circle cx="16" cy="10" r="5"></circle><path d="M6 28c.8-6 4.1-9 10-9s9.2 3 10 9"></path>
          </svg>
        </span>
        <span class="label">Ajouter aux contacts</span><span class="arrow">›</span>
      </a>

      <a class="action" href="tel:+33627270999">
        <span class="icon" aria-hidden="true">
          <svg viewBox="0 0 32 32" width="27" height="27" fill="none" stroke="currentColor" stroke-width="1.5">
            <path d="M10 5l5 5-3 4c1.5 3 3 4.5 6 6l4-3 5 5-3 4c-2 2-8-1-13-6S5 9 7 7l3-2z"></path>
          </svg>
        </span>
        <span class="label">Appeler</span><span class="arrow">›</span>
      </a>

      <a class="action" href="mailto:atelier@macel.fr">
        <span class="icon" aria-hidden="true">
          <svg viewBox="0 0 32 32" width="27" height="27" fill="none" stroke="currentColor" stroke-width="1.5">
            <rect x="4" y="7" width="24" height="18" rx="1"></rect><path d="M5 9l11 9L27 9"></path>
          </svg>
        </span>
        <span class="label">Envoyer un e-mail</span><span class="arrow">›</span>
      </a>

      <a class="action" href="https://macel-sellier.com" target="_blank" rel="noopener">
        <span class="icon" aria-hidden="true">
          <svg viewBox="0 0 32 32" width="27" height="27" fill="none" stroke="currentColor" stroke-width="1.5">
            <circle cx="16" cy="16" r="12"></circle><path d="M4 16h24M16 4c4 4 4 20 0 24M16 4c-4 4-4 20 0 24"></path>
          </svg>
        </span>
        <span class="label">Visiter le site MACEL</span><span class="arrow">›</span>
      </a>
    </nav>
  </section>

  <p class="slogan">L’expertise MACEL, au service de l’équilibre du couple cheval &amp; cavalier</p>
</main>
</body>
</html>
